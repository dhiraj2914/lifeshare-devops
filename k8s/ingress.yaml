apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lifeshare-ingress
  namespace: lifeshare
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: lifeshare.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lifeshare-frontend
                port:
                  number: 80
