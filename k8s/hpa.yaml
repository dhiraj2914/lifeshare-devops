apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lifeshare-web-hpa
  namespace: lifeshare
  labels:
    app.kubernetes.io/name: lifeshare-web-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lifeshare-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
