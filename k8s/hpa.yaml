apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lifeshare-frontend-hpa
  namespace: lifeshare
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lifeshare-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
