# MySQL credentials stored as a K8s Secret.
# Base64 values here are EXAMPLES ONLY (decode: changeme_*)
# In production: use 'kubectl create secret generic' or a sealed-secrets tool.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: lifeshare
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: changeme_root
  MYSQL_DATABASE: blood_bank_db
  MYSQL_USER: lifeshare
  MYSQL_PASSWORD: changeme_app
