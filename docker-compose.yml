# ──────────────────────────────────────────────────────────────
# LifeShare – Docker Compose (local development stack)
# Services: frontend (static server) + db (MySQL 8)
# ──────────────────────────────────────────────────────────────
services:
  # ── Static frontend ────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: lifeshare-frontend:local
    container_name: lifeshare-frontend
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── MySQL database ──────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: lifeshare-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "3307:3306"    # host 3307 → container 3306 (avoids conflicts with local MySQL)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data:
    driver: local
