name: LifeShare CI/CD

on:
  push:
    branches: [ main, devops ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lifeshare-web

jobs:
  # ── 1. Lint & Static Analysis ──────────────────────────────
  lint:
    name: Lint (PHP & JS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: php-cs-fixer

      - name: Lint PHP files
        run: |
          echo "Linting PHP files..."
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint JS files (syntax check)
        run: |
          echo "Checking JS syntax..."
          node --check app.js
          node --check tests/haversine.test.js
          node --check tests/api.test.js

  # ── 2. Unit & Integration Tests ────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Haversine unit tests
        run: node --test tests/haversine.test.js

      - name: Start services for API integration tests
        run: |
          docker compose up -d --build
          # Wait up to 60s for healthcheck
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health.php || curl -sf http://localhost:8088/health.php; then
              echo "Services healthy!"
              break
            fi
            echo "Waiting for services..."
            sleep 2
          done

      - name: Run API response shape tests
        run: |
          PORT=8080
          curl -sf http://localhost:8080/health.php || PORT=8088
          API_URL="http://localhost:${PORT}" node --test tests/api.test.js

      - name: Teardown services
        if: always()
        run: docker compose down

  # ── 3. Build & Security Scan ───────────────────────────────
  build-and-scan:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lifeshare-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: lifeshare-web:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

  # ── 4. Publish to GHCR (main branch only) ──────────────────
  publish:
    name: Publish to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: [ build-and-scan ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
