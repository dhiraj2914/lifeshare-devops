name: LifeShare CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── 1. Lint & static analysis ──────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for TODO/FIXME (informational)
        run: grep -rn "TODO\|FIXME" --include="*.js" --include="*.html" . || true

  # ── 2. Container build ─────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push on PR)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: lifeshare-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Image scan (Trivy) ──────────────────────────────────
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build image for scanning
        run: docker build -t lifeshare-frontend:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: lifeshare-frontend:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  # ── 4. Smoke test ──────────────────────────────────────────
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start frontend container
        run: |
          docker build -t lifeshare-frontend:smoke .
          docker run -d --name lifeshare-smoke -p 3000:3000 lifeshare-frontend:smoke
          sleep 15

      - name: HTTP health check
        run: |
          curl --max-time 10 -sf http://localhost:3000 | grep -q "LifeShare\|Lifeshare\|blood"
          echo "Smoke test PASSED"

      - name: Cleanup
        if: always()
        run: docker rm -f lifeshare-smoke || true
